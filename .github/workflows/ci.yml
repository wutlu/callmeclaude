name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @callmeclaude/mac-agent typecheck
      - run: pnpm --filter @callmeclaude/mac-agent test

  hub-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the X11 computer-use tools (Xvfb, xdotool, scrot; xclip and zenity for the paste test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool scrot xclip zenity dbus-daemon
      - run: pnpm --filter @callmeclaude/mac-agent typecheck
      - run: pnpm --filter @callmeclaude/mac-agent test
        env:
          # test/x11-driver.test.ts starts its own Xvfb; here a missing tool fails instead of skipping.
          CMC_REQUIRE_X11: '1'

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build (unsigned)
        working-directory: apps/ios
        run: |
          printf 'CMC_TEAM_ID = \nCMC_BUNDLE_ID = dev.callmeclaude.ci\n' > Config/Local.xcconfig
          xcodegen generate
          xcodebuild -project CallMeClaude.xcodeproj -scheme CallMeClaude -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle/libs.versions.toml
            apps/android/gradle/wrapper/gradle-wrapper.properties
      - run: ./gradlew assembleDebug test --console=plain

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @callmeclaude/desktop typecheck
      - run: pnpm --filter @callmeclaude/desktop test
      - run: pnpm --filter @callmeclaude/desktop build
      - name: Smoke test (render the panel without a hub, under Xvfb)
        working-directory: apps/desktop
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
          export CMC_HOME="$RUNNER_TEMP/cmc" CMC_DESKTOP_SNAPSHOT="$RUNNER_TEMP/panel.png"
          timeout 120 xvfb-run -a npx electron . --no-sandbox --hidden 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q 'tray=5 link=setup' "$RUNNER_TEMP/smoke.log"
          test -s "$CMC_DESKTOP_SNAPSHOT"
